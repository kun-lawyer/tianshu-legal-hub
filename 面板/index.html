      const q = (now - m.t) / m.life, e = 1 - Math.pow(1 - q, 2.2);
      const hx = m.x + Math.cos(m.a) * m.run * e, hy = m.y + Math.sin(m.a) * m.run * e;
      const tail = m.len * Math.min(1, q * 4), tx = hx - Math.cos(m.a) * tail, ty = hy - Math.sin(m.a) * tail;
      const op = q < .7 ? 1 : (1 - q) / .3;
      const gr = g.createLinearGradient(hx, hy, tx, ty);
      gr.addColorStop(0, rgba('#ffffff', .95 * op)); gr.addColorStop(.08, rgba(col.gold, .9 * op));
      gr.addColorStop(.4, rgba(col.gold, .3 * op)); gr.addColorStop(1, rgba(col.gold, 0));
      g.strokeStyle = gr; g.lineWidth = m.w; g.lineCap = 'round';
      g.beginPath(); g.moveTo(hx, hy); g.lineTo(tx, ty); g.stroke();
      glow(hx, hy, m.w, col.gold, op);
    }
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) { prev = 0; return; }
    if (now - last < 30) return;
    last = now; draw(now);
  }
  // 流星从抬头右侧近乎水平地横穿（抬头只有八十来像素高，斜了就从底边出去）；flare 为真时天枢闪一下
  function meteor(flare = true) {
    if (still) return;
    meteors.push({x: W * (.72 + Math.random() * .28), y: H * (.12 + Math.random() * .3), a: Math.PI - (.01 + Math.random() * .016),
      run: W * (.5 + Math.random() * .3), len: 240 + Math.random() * 200, w: flare ? 2.6 : 1.8, t: performance.now(), life: 1700 + Math.random() * 500});
    if (flare) { const b = document.querySelector('.brand'); b.classList.remove('flare'); void b.offsetWidth; b.classList.add('flare'); }
  }
  // 中台办完一轮：一场流星雨
  function shower() { for (let i = 0; i < 5; i++) setTimeout(() => meteor(i === 0), i * 260 + Math.random() * 120); }
  host.addEventListener('mousemove', e => { const r = host.getBoundingClientRect(); mouse = {x: e.clientX - r.left, y: e.clientY - r.top}; });
  host.addEventListener('mouseleave', () => { mouse = null; });
  new ResizeObserver(size).observe(host);
  refresh(); size();
  nextXiu = performance.now() + 3500; nextMeteor = performance.now() + 6000;
  if (!still) requestAnimationFrame(loop);
  return {meteor, shower, refresh, toggle};
})();
/* ===== 动效与密度开关 ===== */
const FX = Object.assign({fx: '2', density: 'roomy'}, (() => { try { return JSON.parse(localStorage.getItem('tianshu-fx')) || {}; } catch { return {}; } })());
function applyFx() {
  document.documentElement.dataset.fx = FX.fx; document.documentElement.dataset.density = FX.density;
  document.querySelectorAll('#segFx button').forEach(b => b.classList.toggle('on', b.dataset.v === FX.fx));
  document.querySelectorAll('#segDensity button').forEach(b => b.classList.toggle('on', b.dataset.v === FX.density));
  localStorage.setItem('tianshu-fx', JSON.stringify(FX));
}
document.querySelectorAll('#segFx button').forEach(b => b.onclick = () => { FX.fx = b.dataset.v; applyFx(); });
document.querySelectorAll('#segDensity button').forEach(b => b.onclick = () => { FX.density = b.dataset.v; applyFx(); });
applyFx();

/* ===== 全页星空：动效"炫"时在内容后面铺一层稀疏的星和偶尔的流星，只在卡片间隙里看得见 ===== */
const Deep = (() => {
  const cv = document.getElementById('deep'), g = cv.getContext('2d');
  let W = 0, H = 0, stars = [], meteors = [], last = 0, next = performance.now() + 4000;
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim() || '#fff';
  const rgba = (hex, a) => { const n = parseInt(hex.replace('#', '').padEnd(6, 'f').slice(0, 6), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${Math.max(0, a)})`; };
  function size() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({length: Math.round(W * H / 9000)}, () => ({x: Math.random() * W, y: Math.random() * H, r: .4 + Math.random() * 1.1, p: Math.random() * 6.3, s: .4 + Math.random() * 1.4, v: 1 + Math.random() * 4})); }
  function meteor() { meteors.push({x: W * (.3 + Math.random() * .7), y: -20, a: Math.PI * (.62 + Math.random() * .12), len: 180 + Math.random() * 220, run: H * (.7 + Math.random() * .5), t: performance.now(), life: 1500 + Math.random() * 700}); }
  function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden || document.documentElement.dataset.fx !== '2' || now - last < 40) return;
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    const light = document.documentElement.style.colorScheme === 'light', paper = css('--paper'), gold = css('--gold'), k = light ? .35 : 1;
    g.clearRect(0, 0, W, H);
    for (const s of stars) { s.x -= s.v * dt; if (s.x < -2) s.x += W + 4;
      g.fillStyle = rgba(paper, (.25 + .35 * Math.sin(now / 1000 * s.s + s.p)) * k); g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.283); g.fill(); }
    if (now > next) { meteor(); next = now + 5000 + Math.random() * 9000; }
    meteors = meteors.filter(m => now - m.t < m.life);
    for (const m of meteors) { const q = (now - m.t) / m.life, e = 1 - Math.pow(1 - q, 2), hx = m.x + Math.cos(m.a) * m.run * e, hy = m.y + Math.sin(m.a) * m.run * e;
      const tl = m.len * Math.min(1, q * 4), tx = hx - Math.cos(m.a) * tl, ty = hy - Math.sin(m.a) * tl, op = (q < .7 ? 1 : (1 - q) / .3) * k;
      const gr = g.createLinearGradient(hx, hy, tx, ty); gr.addColorStop(0, rgba('#ffffff', .9 * op)); gr.addColorStop(.1, rgba(gold, .7 * op)); gr.addColorStop(1, rgba(gold, 0));
      g.strokeStyle = gr; g.lineWidth = 1.6; g.lineCap = 'round'; g.beginPath(); g.moveTo(hx, hy); g.lineTo(tx, ty); g.stroke(); }
  }
  addEventListener('resize', size); size();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(loop);
  return {shower: () => { for (let i = 0; i < 4; i++) setTimeout(meteor, i * 300); }};
})();

setTimeout(() => document.documentElement.classList.remove('boot'), 3200);

// 过了 18 点默认看晚报
if (bj().getHours() >= 18) document.querySelector('.tab[data-kind="evening"]').click();
// 先取本人称呼，待办里「负责人是不是本人」才判断得对
loadState().then(loadSlow);
setInterval(loadState, 10000);
setInterval(() => { AUTO = true; setTimeout(() => AUTO = false, 15000); loadSlow(); }, 120000);
</script>
