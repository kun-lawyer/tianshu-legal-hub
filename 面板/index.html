<!doctype html>
<html lang="zh-CN" class="boot">
<head>
<meta charset="utf-8">
<title>天枢中台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 每种样式只定 7 个基色（由 JS 写入），其余由基色混出；字体、圆角、底纹、标记形状按 data-style 覆盖 */
  :root {
    --night: #0C1428; --paper: #E8E5D8; --paper-dim: #A5AEC1; --mute: #75819B;
    --seal: #DB5A42; --gold: #EEC870; --celadon: #86C6BE;
    --night-2: color-mix(in srgb, var(--night) 92%, var(--paper));
    --night-3: color-mix(in srgb, var(--night) 86%, var(--paper));
    --rule: color-mix(in srgb, var(--night) 80%, var(--paper));
    --seal-soft: color-mix(in srgb, var(--seal) 15%, transparent);
    --gold-soft: color-mix(in srgb, var(--gold) 15%, transparent);
    --celadon-soft: color-mix(in srgb, var(--celadon) 15%, transparent);
    --shadow: 0 12px 34px color-mix(in srgb, #000 22%, transparent);
    --surface: var(--night-2);
    --radius: 10px;
    --serif: "Source Han Serif SC", "Noto Serif SC", "STZhongsong", "华文中宋", "SimSun", serif;
    --kai: "KaiTi", "STKaiti", "楷体", serif;
    --sans: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    --display: var(--serif); --dw: 600;
    --field: none;
  }

  /* 天枢：深靛夜空，静止星点 */
  [data-style="tianshu"] {
    --surface: color-mix(in srgb, var(--night-2) 90%, transparent);
    --field:
      radial-gradient(circle, color-mix(in srgb, var(--paper) 55%, transparent) 0 .8px, transparent 1.4px) 13px 47px / 211px 173px,
      radial-gradient(circle, color-mix(in srgb, var(--paper) 30%, transparent) 0 .6px, transparent 1.2px) 101px 9px / 137px 149px,
      radial-gradient(circle, color-mix(in srgb, var(--gold) 65%, transparent) 0 1px, transparent 2.2px) 67px 120px / 389px 331px,
      radial-gradient(1200px 620px at 86% -12%, color-mix(in srgb, var(--celadon) 10%, transparent), transparent 65%),
      radial-gradient(900px 520px at -4% 108%, color-mix(in srgb, var(--seal) 7%, transparent), transparent 60%);
  }
  /* 浑仪：青铜，右上角几道环圈 */
  [data-style="hunyi"] {
    --radius: 3px;
    --field:
      radial-gradient(circle at 97% -18%, transparent 0 359px, color-mix(in srgb, var(--gold) 16%, transparent) 359px 360px, transparent 361px 519px,
        color-mix(in srgb, var(--gold) 12%, transparent) 519px 521px, transparent 522px 739px, color-mix(in srgb, var(--gold) 8%, transparent) 739px 740px, transparent 741px),
      radial-gradient(1000px 600px at 97% -18%, color-mix(in srgb, var(--gold) 9%, transparent), transparent 70%),
      radial-gradient(800px 500px at 0% 110%, color-mix(in srgb, var(--celadon) 7%, transparent), transparent 60%);
  }
  /* 星图：敦煌星图纸本，楷体，朱墨黄三色星点 */
  [data-style="xingtu"] {
    --display: var(--kai); --dw: 400; --radius: 0px; --shadow: none;
    --night-2: color-mix(in srgb, var(--night) 55%, #fff);
    --night-3: color-mix(in srgb, var(--night) 94%, var(--paper));
    --rule: color-mix(in srgb, var(--night) 74%, var(--paper));
    --field:
      radial-gradient(circle at 50% 46%, transparent 0 calc(46vmax - 1px), color-mix(in srgb, var(--seal) 14%, transparent) calc(46vmax - 1px) 46vmax, transparent 46vmax),
      repeating-linear-gradient(90deg, transparent 0 239px, color-mix(in srgb, var(--paper) 5%, transparent) 239px 240px),
      radial-gradient(1400px 800px at 50% 0%, color-mix(in srgb, #fff 30%, transparent), transparent 70%);
  }
  /* 朗日：白天用，干净 */
  [data-style="langri"] {
    --display: var(--sans); --radius: 14px;
    --night-2: color-mix(in srgb, var(--night) 18%, #fff);
    --night-3: color-mix(in srgb, var(--night) 96%, var(--paper));
    --rule: color-mix(in srgb, var(--night) 87%, var(--paper));
    --shadow: 0 1px 2px color-mix(in srgb, var(--paper) 6%, transparent), 0 10px 28px color-mix(in srgb, var(--paper) 7%, transparent);
    --field: linear-gradient(180deg, color-mix(in srgb, var(--gold) 8%, transparent), transparent 340px);
  }

  * { box-sizing: border-box; }
  html { background: var(--night); }
  body { margin: 0; color: var(--paper); font: 16px/1.65 var(--sans); min-height: 100vh;
    background: var(--field), var(--night); background-attachment: fixed; }
  button, textarea, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .wrap { max-width: 1640px; margin: 0 auto; padding: 0 36px; }

  /* 抬头：滚动时贴顶 */
  header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--rule);
    background: color-mix(in srgb, var(--night) 82%, transparent); backdrop-filter: blur(14px); }
  header .wrap { display: flex; align-items: center; gap: 30px; padding-top: 16px; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand h1 { margin: 0; font: var(--dw) 30px/1 var(--display); letter-spacing: .36em; }
  .brand small { display: block; margin-top: 9px; color: var(--mute); letter-spacing: .34em; font-size: 13px; }
  [data-style="xingtu"] .brand h1 { font-size: 34px; letter-spacing: .3em; }
  [data-style="langri"] .brand h1 { font-size: 26px; letter-spacing: .2em; }

  /* 北斗七星：天枢亮着即中台在线 */
  .dipper { width: 112px; height: 58px; flex: none; overflow: visible; }

  /* 点标志弹出的星钟：北斗按此刻方位绕北辰转 */
  .starclock { position: absolute; left: 36px; top: calc(100% + 8px); width: 300px; padding: 14px 16px 12px; border-radius: var(--radius); z-index: 30;
    background: var(--night-2); border: 1px solid var(--rule); box-shadow: var(--shadow), 0 12px 34px color-mix(in srgb, #000 18%, transparent);
    opacity: 0; transform: translateY(-6px) scale(.97); transform-origin: 30px 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  .starclock.on { opacity: 1; transform: none; pointer-events: auto; }
  .starclock h3 { margin: 0 0 4px; font: var(--dw) 15px var(--display); letter-spacing: .25em; }
  .starclock p { margin: 6px 0 0; font-size: 13px; color: var(--paper-dim); line-height: 1.6; }
  .dial { display: block; width: 268px; height: 268px; overflow: visible; }
  .dial .ring { fill: none; stroke: var(--paper-dim); stroke-width: .35; opacity: .35; }
  .dial .tick { stroke: var(--paper-dim); stroke-width: .4; opacity: .5; }
  .dial .zi { fill: var(--paper-dim); font: 4.2px var(--serif); text-anchor: middle; dominant-baseline: central; }
  .dial .zi.on { fill: var(--gold); font-weight: 700; }
  .dial .asterism { fill: none; stroke: var(--paper-dim); stroke-width: .45; opacity: .6; stroke-linejoin: round; }
  .dial .pointer { stroke: var(--gold); stroke-width: .4; stroke-dasharray: 1 1.6; opacity: .7; }
  .dial .stars circle { fill: var(--paper); }
  .dial .shu { fill: var(--gold); }
  .dial .halo { fill: var(--gold); opacity: .25; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  .dial .pole { fill: var(--celadon); }
  .dial .nm { fill: var(--paper-dim); font: 3.4px var(--serif); opacity: .9; }
  .dial #nmShu, .dial #nmTail { transition: opacity .3s; }
  .starclock:not(.settled) #nmShu, .starclock:not(.settled) #nmTail { opacity: 0; }
  .dial .rot { transition: transform 1.6s cubic-bezier(.25,.8,.25,1); }
  .dipper .asterism { fill: none; stroke: var(--paper-dim); stroke-width: .8; opacity: .45; stroke-linejoin: round; }
  .dipper .pointer { stroke: var(--gold); stroke-width: .9; stroke-dasharray: 1.6 2.8; opacity: .6; }
  .dipper .stars circle { fill: var(--paper); opacity: .85; }
  .dipper .shu { fill: var(--gold); transition: fill .4s; }
  .dipper .halo { fill: var(--gold); opacity: .22; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  html.hub-off .dipper .shu { fill: var(--mute); }
  html.hub-off .dipper .halo, html.hub-off .dipper .pointer { display: none; }

  .clock { font: 500 30px/1 var(--mono); color: var(--gold); letter-spacing: .04em; padding-left: 30px; border-left: 1px solid var(--rule); }
  .clock span { display: block; margin-top: 8px; font: 14px var(--sans); color: var(--mute); letter-spacing: .18em; }
  .spacer { flex: 1; }
  .sep { width: 1px; align-self: stretch; background: var(--rule); }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--paper-dim); padding: 6px 14px;
    border: 1px solid var(--rule); border-radius: 999px; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--celadon); box-shadow: 0 0 0 3px var(--celadon-soft); }
  .dot.off { background: var(--seal); box-shadow: 0 0 0 3px var(--seal-soft); }
  .themebtn { border: 1px solid var(--rule); background: var(--night-2); border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px; font-size: 14px; color: var(--paper-dim); }
  .themebtn:hover { border-color: var(--gold); color: var(--paper); }
  .swatch-mini { display: inline-flex; }
  .swatch-mini i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--night-2); margin-left: -4px; }
  .swatch-mini i:first-child { margin-left: 0; }

  /* 样式面板 */
  .themes { position: absolute; right: 36px; top: calc(100% + 8px); width: 380px; padding: 16px; border-radius: var(--radius);
    background: var(--night-2); border: 1px solid var(--rule); box-shadow: var(--shadow), 0 12px 34px color-mix(in srgb, #000 18%, transparent); display: none; }
  .themes.on { display: block; }
  .themes h3 { margin: 0 0 12px; font: var(--dw) 16px var(--display); letter-spacing: .25em; }
  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .preset { border: 1px solid var(--rule); border-radius: 8px; padding: 0; cursor: pointer; background: none; overflow: hidden; text-align: left; }
  .preset .pv { display: flex; align-items: center; gap: 5px; height: 54px; padding: 0 12px; background: var(--pv-bg); color: var(--pv-ink); }
  .preset .pv i { width: 8px; height: 8px; border-radius: 50%; }
  .preset .pv b { margin-left: auto; font: 600 19px var(--serif); letter-spacing: .2em; }
  .preset[data-name="星图"] .pv b { font-family: var(--kai); font-weight: 400; font-size: 21px; }
  .preset[data-name="朗日"] .pv b { font-family: var(--sans); }
  .preset .nt { display: block; padding: 5px 10px 6px; font-size: 13px; color: var(--paper-dim); }
  .preset.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .custom { display: grid; grid-template-columns: 1fr auto; gap: 9px 14px; align-items: center; font-size: 15px; color: var(--paper-dim); }
  .custom input[type=color] { width: 44px; height: 26px; border: 1px solid var(--rule); border-radius: 6px; background: none; padding: 1px; cursor: pointer; }
  .themes .sub { margin: 0 0 8px; font-size: 13px; color: var(--mute); letter-spacing: .12em; }
  .themes .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--mute); }

  /* 行内操作：悬停或键盘聚焦时出现 */
  .acts-inline { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; margin-top: 4px; opacity: 0; max-height: 0; overflow: hidden;
    transition: opacity .15s, max-height .15s; }
  li:hover > .acts-inline, li:focus-within > .acts-inline, .agenda-day li:hover .acts-inline { opacity: 1; max-height: 60px; }
  .acts-inline .btn { padding: 1px 9px; font-size: 13px; }
  .hbtn { margin-left: 8px; border: 1px solid var(--rule); background: none; border-radius: 6px; padding: 1px 10px; cursor: pointer;
    font: 13px var(--sans); letter-spacing: 0; color: var(--paper-dim); }
  .hbtn:hover { border-color: var(--gold); color: var(--gold); }
  .agenda-day li { cursor: default; }
  .agenda-day li .acts-inline { grid-column: 2; }
  .stamp { cursor: pointer; }
  .stamp:hover .n { color: var(--paper); }

  /* 送审台多选 */
  .intake.pick li { grid-template-columns: auto 1fr auto; }
  .intake.pick li > .w, .intake.pick li > .acts-inline { grid-column: 2 / -1; }
  .intake.pick input[type=checkbox], .selbar input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; margin: 3px 0 0; }
  .intake.pick li.sel { background: color-mix(in srgb, var(--gold) 9%, transparent); border-radius: 6px; }
  .selbar { display: flex; align-items: center; gap: 8px; margin-left: auto; font: 13px var(--sans); letter-spacing: 0; color: var(--paper-dim); }
  .selbar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .selbar .hbtn { margin-left: 0; }
  .selbar .hbtn.go { border-color: var(--gold); color: var(--gold); }

  /* 表单弹窗 */
  .modal-mask { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 45%, transparent); display: none;
    align-items: center; justify-content: center; }
  .modal-mask.on { display: flex; }
  .modal { width: min(560px, 92vw); background: var(--night-2); border: 1px solid var(--rule); border-radius: var(--radius);
    box-shadow: 0 20px 50px color-mix(in srgb, #000 30%, transparent); padding: 20px 22px; }
  .modal h3 { margin: 0 0 14px; font: var(--dw) 18px var(--display); letter-spacing: .2em; }
  .modal .fields { display: grid; grid-template-columns: 96px 1fr; gap: 10px 12px; align-items: center; font-size: 15px; }
  .modal .fields label { color: var(--paper-dim); }
  .modal input, .modal select, .modal textarea { width: 100%; background: var(--night); border: 1px solid var(--rule); border-radius: 6px;
    padding: 6px 9px; font-size: 15px; color: var(--paper); }
  .modal .hint { grid-column: 2; font-size: 12px; color: var(--mute); margin-top: -4px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .modal.wide { width: min(820px, 94vw); }
  .modal .checks { max-height: 46vh; overflow: auto; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; }
  .modal .checks label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; color: var(--paper); font-size: 14px; border-bottom: 1px dashed var(--rule); }
  .modal .checks label:last-child { border-bottom: 0; }
  .modal .checks label.off { color: var(--mute); }
  .modal .checks input { width: auto; margin-top: 3px; }
  .modal .checks small { display: block; color: var(--mute); font-size: 12px; word-break: break-all; }
  .modal .fhtml { font-size: 13px; color: var(--paper-dim); }

  /* 在跑提示条 */
  #running { display: none; font-size: 14px; color: var(--gold); background: var(--gold-soft); border-bottom: 1px solid var(--rule); }
  #running.on { display: block; }
  #running .wrap { padding-top: 7px; padding-bottom: 7px; }
  #running i { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1.4s infinite; vertical-align: middle; }

  /* 十四日庭期条 */
  .docket { margin-top: 22px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
  .docket-head { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px 10px; border-bottom: 1px solid var(--rule); }
  .docket-head h2 { margin: 0; font: var(--dw) 18px var(--display); letter-spacing: .3em; }
  .legend { font-size: 14px; color: var(--mute); display: flex; gap: 18px; }
  .legend em { font-style: normal; display: inline-flex; align-items: center; gap: 6px; }
  .days-scroll { overflow-x: auto; scrollbar-color: var(--rule) transparent; scrollbar-width: thin; }
  .days { display: grid; grid-template-columns: repeat(14, minmax(84px, 1fr)); min-width: 1176px; }
  .day { border-right: 1px solid var(--rule); padding: 12px 9px 16px; min-height: 190px; position: relative; transition: background .2s; }
  .day:hover { background: var(--night-3); }
  .day:last-child { border-right: 0; }
  .day.weekend { background: color-mix(in srgb, var(--paper) 3%, transparent); }
  .day .num { font: var(--dw) 30px/1 var(--display); }
  .day .wk { font-size: 13px; color: var(--mute); letter-spacing: .2em; margin-left: 5px; }
  .day .mon { position: absolute; top: 14px; right: 10px; font-size: 12px; color: var(--gold); letter-spacing: .1em; }
  .day.today { background: linear-gradient(180deg, var(--gold-soft), transparent 75%); box-shadow: inset 0 3px 0 var(--gold); }
  .day.today .num { color: var(--gold); }
  .day.today::after { content: "今日"; position: absolute; top: 15px; right: 10px; font-size: 12px; color: var(--gold); letter-spacing: .2em; }
  .marks { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .stamp { display: grid; grid-template-columns: 30px 1fr; gap: 7px; align-items: start; }
  .stamp .t { font: 14px/1.2 var(--mono); }
  .stamp .n { font-size: 13px; line-height: 1.35; color: var(--paper-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .more { font-size: 13px; color: var(--mute); }

  /* 庭期标记：基础是方印（浑仪用），其余样式在下方改形 */
  .stamp .seal { width: 34px; height: 34px; display: grid; place-items: center; font: 700 17px var(--display); color: var(--seal);
    border: 2px solid var(--seal); border-radius: 4px; transform: rotate(-6deg); background: var(--seal-soft);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--seal) 40%, transparent); animation: press .5s cubic-bezier(.2,.9,.3,1.3) both; }
  .stamp.deadline .seal { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); transform: rotate(4deg);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); }
  .stamp.other .seal { color: var(--paper-dim); border: 1px dashed var(--mute); background: none; box-shadow: none; transform: none; font-size: 14px; }

  [data-style="tianshu"] .stamp .seal { border-radius: 50%; transform: none; border-width: 1px; font-weight: 600; font-size: 15px;
    background: radial-gradient(circle, color-mix(in srgb, var(--seal) 32%, transparent), var(--seal-soft) 70%);
    box-shadow: 0 0 14px color-mix(in srgb, var(--seal) 45%, transparent); animation-name: kindle; animation-duration: .7s; animation-timing-function: ease-out; }
  [data-style="tianshu"] .stamp.deadline .seal { background: radial-gradient(circle, color-mix(in srgb, var(--gold) 30%, transparent), var(--gold-soft) 70%);
    box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 40%, transparent); }
  [data-style="tianshu"] .stamp.other .seal { box-shadow: none; background: none; }

  [data-style="xingtu"] .stamp .seal { border-radius: 50%; transform: none; border-width: 1.5px; box-shadow: none; font-weight: 400; font-size: 17px;
    background: var(--seal); color: var(--night); animation-name: kindle; animation-duration: .6s; animation-timing-function: ease-out; }
  [data-style="xingtu"] .stamp.deadline .seal { background: none; color: var(--paper); border-color: var(--paper); }
  [data-style="xingtu"] .stamp.other .seal { background: color-mix(in srgb, var(--gold) 35%, transparent); border: 1.5px solid var(--gold); color: var(--paper); }

  [data-style="langri"] .stamp .seal { border-radius: 8px; transform: none; border-width: 1px; box-shadow: none; font: 600 14px var(--sans);
    animation-name: fade; animation-duration: .4s; animation-timing-function: ease-out; }

  /* 主体四栏 */
  main.wrap { display: grid; gap: 24px; padding-top: 22px; padding-bottom: 56px; align-items: start;
    grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
    grid-template-areas: "ask tasks" "agenda intake" "rules report"; }
  .colw { display: contents; }
  .a-ask { grid-area: ask; } .a-tasks { grid-area: tasks; } .a-agenda { grid-area: agenda; }
  .a-intake { grid-area: intake; } .a-rules { grid-area: rules; } .a-report { grid-area: report; }
  section { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  section > h2 { margin: 0; padding: 15px 22px; font: var(--dw) 17px var(--display); letter-spacing: .3em; border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; gap: 10px; }
  section > h2 small { font: 14px var(--sans); letter-spacing: 0; color: var(--mute); }
  section > h2 .count { font: 600 14px var(--mono); letter-spacing: 0; padding: 1px 9px; border-radius: 999px; background: var(--seal); color: #fff; }
  section > h2 .count.zero { background: var(--night-3); color: var(--mute); }
  section > h2 .aside { margin-left: auto; font: 14px var(--sans); letter-spacing: 0; color: var(--mute); }
  .body { padding: 14px 20px 16px; }
  .empty { color: var(--mute); padding: 6px 0; }

  /* 各样式的栏目标题 */
  [data-style="tianshu"] section > h2::before, [data-style="tianshu"] .docket-head h2::before { content: ""; display: inline-block; flex: none;
    width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px 2px color-mix(in srgb, var(--gold) 45%, transparent); }
  [data-style="tianshu"] .docket-head h2::before { margin-right: 12px; vertical-align: .22em; }
  [data-style="hunyi"] section > h2, [data-style="hunyi"] .docket-head { border-bottom: 0; padding-bottom: 17px;
    background:
      linear-gradient(var(--rule), var(--rule)) bottom / 100% 1px no-repeat,
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--gold) 70%, transparent) 0 1px, transparent 1px 40px) 22px 100% / 100% 9px no-repeat,
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--gold) 40%, transparent) 0 1px, transparent 1px 8px) 22px 100% / 100% 5px no-repeat; }
  [data-style="hunyi"] section, [data-style="hunyi"] .docket { box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px color-mix(in srgb, var(--gold) 22%, transparent), var(--shadow); }
  [data-style="xingtu"] section > h2, [data-style="xingtu"] .docket-head { border-bottom: 3px double color-mix(in srgb, var(--paper) 30%, transparent); letter-spacing: .24em; }

  /* 等你决定 */

  .dossier.notice::before { background: var(--gold); }

    transition: border-color .15s, color .15s, background .15s; }

  .btn.rec { border-color: var(--gold); color: var(--gold); }

  .row { display: flex; gap: 8px; margin-top: 8px; }

  /* 近两周安排 */

  .agenda-day li .k { font: 14px var(--mono); color: var(--paper-dim); }

  /* 自动化 */

  .rule .acts { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .rule .acts .btn { white-space: nowrap; }
  .rule.paused { opacity: .7; }
  .rule .tag { color: var(--gold); font-size: 13px; margin-left: 7px; }
  .who { display: flex; flex-wrap: wrap; gap: 7px 18px; margin-top: 16px; font-size: 14px; color: var(--paper-dim); }
  .who span { display: inline-flex; align-items: center; gap: 6px; }

  /* 送审台 */

  .chip.wait { color: var(--gold); background: var(--gold-soft); }

  /* 汇报：晨报、晚报、周研判、工作日志 */

  .tabs { display: flex; gap: 2px; margin-left: auto; }
  .tab { border: 0; background: none; color: var(--mute); padding: 2px 10px; font: 15px var(--sans); letter-spacing: 0; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--paper); border-color: var(--gold); }
  .report { max-height: 598px; overflow: auto; font-size: 15px; color: var(--paper-dim); scrollbar-color: var(--rule) transparent; scrollbar-width: thin; }
  .report h3 { margin: 16px 0 5px; font: var(--dw) 15px var(--display); color: var(--gold); letter-spacing: .2em; }
  [data-style="xingtu"] .report h3 { font-size: 17px; }
  .report h3:first-of-type { margin-top: 4px; }
  .report p, .report li { margin: 2px 0; }
  .report ul { margin: 0; padding-left: 16px; }

  #toast { position: fixed; right: 24px; bottom: 24px; background: var(--paper); color: var(--night); padding: 9px 16px; border-radius: 6px;
    font-size: 15px; display: none; box-shadow: 0 10px 30px color-mix(in srgb, #000 25%, transparent); z-index: 30; }

  @keyframes press { from { transform: scale(1.6) rotate(-14deg); opacity: 0; } to { opacity: 1; } }
  @keyframes kindle { from { transform: scale(.3); opacity: 0; filter: brightness(2.2); } 60% { opacity: 1; } to { opacity: 1; filter: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  @keyframes twinkle { 50% { opacity: .05; transform: scale(.65); } }
  @keyframes pulse { 50% { opacity: .25; } }

  /* 星幕：画布铺在抬头里、内容下面 */
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  header > .wrap { position: relative; z-index: 1; }
  /* 抬头底边一道流光；指极线上的光点流向北极 */
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--gold), color-mix(in srgb, #fff 70%, var(--gold)), var(--gold), transparent) 0 0 / 22% 100% no-repeat;
    animation: sweep 7s cubic-bezier(.45,0,.55,1) infinite; }
  .dipper .pointer { animation: energy 1.6s linear infinite; }
  @keyframes sweep { from { background-position: -30% 0; } to { background-position: 130% 0; } }
  @keyframes energy { to { stroke-dashoffset: -8.8; } }
  .brand { cursor: pointer; }

  /* 开场：版块依次浮现，标志连线自画 */
  html.boot .docket, html.boot main section { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  html.boot .docket { animation-delay: .1s; }
  html.boot .c1 section { animation-delay: .28s; } html.boot .c2 section { animation-delay: .38s; }
  html.boot .c3 section { animation-delay: .48s; } html.boot .c4 section { animation-delay: .58s; }
  html.boot .colw section:nth-child(2) { animation-delay: .7s; }
  html.boot .dipper .asterism { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.8s .3s ease-out forwards; }
  html.boot .dipper .stars circle { animation: kindle .6s ease-out both; }
  html.boot .dipper .stars circle:nth-child(1) { animation-delay: .5s; } html.boot .dipper .stars circle:nth-child(2) { animation-delay: .65s; }
  html.boot .dipper .stars circle:nth-child(3) { animation-delay: .8s; } html.boot .dipper .stars circle:nth-child(4) { animation-delay: .95s; }
  html.boot .dipper .stars circle:nth-child(5) { animation-delay: 1.1s; } html.boot .dipper .stars circle:nth-child(6) { animation-delay: 1.25s; }
  html.boot .dipper .shu { animation: kindle .8s 1.5s ease-out both; }
  .dipper .shu { transform-box: fill-box; transform-origin: center; }
  .brand.flare .dipper .shu { animation: flare 1.4s ease-out; }
  .brand.flare .dipper .pointer { animation: flare-line 1.4s ease-out; }

  /* 有任务在跑：运行条流光 */
  #running.on { background: linear-gradient(100deg, var(--gold-soft) 0 38%, color-mix(in srgb, var(--gold) 30%, transparent) 50%, var(--gold-soft) 62% 100%) 0 0 / 260% 100%;
    animation: flow 3.2s linear infinite; }

  /* 今明两天的开庭：印章泛涟漪 */
  .stamp.soon .seal { position: relative; }
  .stamp.soon .seal::after { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 1px solid var(--seal);
    animation: ripple 2.6s 1.2s ease-out infinite; opacity: 0; pointer-events: none; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes flare { 25% { transform: scale(2.2); filter: drop-shadow(0 0 6px var(--gold)); } }
  @keyframes flare-line { 25% { opacity: 1; stroke-width: 1.6; } }
  @keyframes flow { from { background-position: 100% 0; } to { background-position: -160% 0; } }
  @keyframes ripple { 0% { opacity: .75; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.7); } }
  @media (prefers-reduced-motion: reduce) {
    .stamp .seal, #running i, .dipper .halo, #running.on, .stamp.soon .seal::after, .brand.flare *, header::after, .dipper .pointer { animation: none !important; }
    html.boot * { animation: none !important; }
    * { transition: none !important; }
  }
  @media (max-width: 1180px) {
    main.wrap { grid-template-columns: 1fr; grid-template-areas: "ask" "tasks" "agenda" "intake" "rules" "report"; }
    .wrap { padding: 0 18px; }
    header .wrap { flex-wrap: wrap; gap: 16px; }
    .clock { padding-left: 0; border-left: 0; }
    .rules { grid-template-columns: 1fr; }
    .themes { right: 18px; width: min(380px, calc(100vw - 36px)); }
  }

  /* ================= 新布局（2026-11-16）：时间带 + 今天 / 案件 / 收件三栏，汇报与自动化进抽屉 ================= */
  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  main.wrap { grid-template-columns: minmax(0, 3fr) minmax(0, 5fr) minmax(0, 3.3fr); grid-template-areas: none; gap: 22px; position: relative; z-index: 1; }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .col > * { flex: none; }
  body > .wrap { position: relative; z-index: 1; }

  /* 抬头：一句话指令 */
  .say { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 220px; padding: 5px 6px 5px 14px; border: 1px solid var(--rule); border-radius: 999px;
    background: color-mix(in srgb, var(--night-2) 80%, transparent); transition: border-color .2s, box-shadow .2s; }
  .say:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft), 0 0 24px color-mix(in srgb, var(--gold) 18%, transparent); }
  .say input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 15px; color: var(--paper); }
  .say input::placeholder { color: var(--mute); }
  .say .on { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 2px 6px 2px 11px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  [hidden] { display: none !important; }
  #busybar { position: fixed; left: 0; top: 0; height: 3px; width: 100%; z-index: 60; pointer-events: none; opacity: 0; transition: opacity .2s;
    background: linear-gradient(90deg, transparent, var(--gold), var(--celadon), var(--gold), transparent) 0 0 / 40% 100% no-repeat; }
  #busybar.on { opacity: 1; animation: sweep 1.1s linear infinite; }
  button.busy { pointer-events: none; opacity: .65; position: relative; color: transparent !important; }
  button.busy::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -7px 0 0 -7px; border-radius: 50%;
    border: 2px solid var(--gold); border-top-color: transparent; animation: turn .7s linear infinite; }
  .doing { opacity: .55; transition: opacity .15s; }
  @keyframes turn { to { transform: rotate(360deg); } }
  [data-fx="0"] #busybar.on, [data-fx="0"] button.busy::after { animation: sweep 1.1s linear infinite !important; }
  [data-fx="0"] button.busy::after { animation: turn .7s linear infinite !important; }
  .btn:active, .hbtn:active, .themebtn:active { transform: scale(.96); }
  /* 行内操作原来要悬停才出现，点不到就像没反应：改为一直显示 */
  .acts-inline { opacity: 1; max-height: none; overflow: visible; }
  #f_docs { display: flex; flex-wrap: wrap; gap: 2px 18px; max-height: none; }
  #f_docs label { border-bottom: 0; }
  .case .extra { margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--rule); font-size: 13.5px; color: var(--paper-dim); }

  .case .extra label { display: flex; gap: 7px; align-items: flex-start; padding: 1px 0; cursor: pointer; }
  .case .extra label input { margin-top: 4px; accent-color: var(--gold); }
  .case .extra label.ok { color: var(--mute); text-decoration: line-through; }
  .case .extra label small { color: var(--mute); }
  .case .extra details { margin: 6px 0 0; } .case .extra details summary::before { content: "▸ "; } .case .extra details[open] summary::before { content: "▾ "; }
  .case .extra details summary { font: 600 13px var(--sans); color: var(--mute); letter-spacing: .15em; display: block; }
  .case .extra details > label { margin-left: 2px; }
  .case .extra .cg { font-size: 12.5px; color: var(--gold); margin: 6px 0 1px; letter-spacing: .1em; } .case .extra .cg.src { color: var(--mute); letter-spacing: 0; }
  .case .extra details > label { border: 0; padding-left: 0; }
  .say .on button { border: 0; background: none; color: var(--gold); cursor: pointer; font-size: 15px; padding: 0 4px; }
  .say .go { border: 0; border-radius: 999px; background: var(--gold); color: var(--night); font-size: 14px; padding: 4px 14px; cursor: pointer; white-space: nowrap; }
  .say .go:hover { filter: brightness(1.1); }

  /* 时间带：十四日庭期压成一条 */
  .band { margin-top: 14px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow-x: auto; box-shadow: var(--shadow); scrollbar-width: thin; }
  .band .days { grid-template-columns: repeat(14, minmax(96px, 1fr)); min-width: 1344px; }

  .band .day .mon { top: 9px; }
  .band .marks { margin-top: 6px; gap: 4px; }

  .band .stamp:hover { background: color-mix(in srgb, var(--paper) 7%, transparent); }

  .band .stamp .n { display: inline; font-size: 12.5px; }

  .cal h3 { margin: 0 0 8px; font: var(--dw) 17px var(--display); letter-spacing: .2em; }

  .cal .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .cal .wh { font-size: 12px; color: var(--mute); text-align: center; padding: 3px 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .cal .cd { min-height: 78px; padding: 3px 5px 5px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 12px; overflow: hidden; }
  .cal .cd.weekend { background: color-mix(in srgb, var(--paper) 3%, transparent); }

  .cal .cd b { display: block; font: 14px var(--mono); }

  .cal .ev.hearing { color: var(--seal); }

  @media (max-width: 900px) { .cal { grid-template-columns: 1fr; } }
  .stamp.med .seal { color: var(--celadon) !important; border-color: var(--celadon) !important; background: var(--celadon-soft) !important; box-shadow: none !important; }

  /* 倒计时 */
  .hero { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; padding: 16px 18px; }

  .hero.med .arc { stroke: var(--celadon); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--celadon) 60%, transparent)); }
  .hero .ringbox { position: relative; width: 96px; height: 96px; }

  .hero .ringbox b small { font: 12px var(--sans); color: var(--mute); margin-left: 2px; }
  .hero .lab { font-size: 13px; color: var(--mute); letter-spacing: .2em; }

  .hero .cd small { font: 14px var(--sans); color: var(--paper-dim); margin: 0 6px 0 2px; }

  .hero .nm:hover { color: var(--gold); }
  .hero .wh { font-size: 13px; color: var(--mute); }

  /* 今明两天 */
  #today li { cursor: pointer; grid-template-columns: auto 1fr; align-items: baseline; }
  .intake li.grp { display: block; }
  .grp .gh { font: var(--dw) 16px var(--display); color: var(--gold); display: flex; align-items: baseline; gap: 10px; }
  .grp .gh small { font: 13px var(--sans); color: var(--mute); }
  .grp > ul { margin: 4px 0 0 3px; padding-left: 13px; border-left: 2px solid color-mix(in srgb, var(--gold) 40%, var(--rule)); }
  .grp > ul li:first-child { padding-top: 6px; }
  #today li:hover .f { color: var(--gold); }
  #today .f { white-space: normal; }
  .chip.hot { color: var(--seal); background: var(--seal-soft); }

  /* 案件栏 */
  .colhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 8px; position: sticky; top: 0; z-index: 5; border-radius: var(--radius);
    background: color-mix(in srgb, var(--night) 78%, transparent); backdrop-filter: blur(12px); }
  .colhead h2 { margin: 0; font: var(--dw) 19px var(--display); letter-spacing: .3em; display: flex; align-items: center; gap: 10px; }
  .colhead h2 .count { font: 600 14px var(--mono); letter-spacing: 0; padding: 1px 9px; border-radius: 999px; background: var(--seal); color: #fff; }
  .colhead h2 .count.zero { background: var(--night-3); color: var(--mute); }
  .colhead small { color: var(--mute); font-size: 13px; flex: 1; min-width: 200px; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 2px 13px; font-size: 13px; color: var(--paper-dim); cursor: pointer; }
  .seg button.on { background: var(--gold); color: var(--night); }
  #cases { display: flex; flex-direction: column; gap: 14px; }
  .case { position: relative; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    padding: 14px 18px 13px; transition: transform .25s, box-shadow .25s, border-color .25s; }
  .case .chead { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; cursor: pointer; }
  .case .chead h3 { margin: 0; font: var(--dw) 18px/1.4 var(--display); }
  .case .chead:hover h3 { color: var(--gold); }
  .case .fold { margin-left: auto; border: 0; background: none; color: var(--mute); cursor: pointer; font-size: 13px; padding: 0 4px; }
  .case .no { font: 13px var(--mono); color: var(--mute); }
  .case .node { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; margin-top: 7px; font-size: 15px; }
  .case .node .k { font: 14px var(--mono); color: var(--seal); }
  .case .node.deadline .k { color: var(--gold); } .case.med .node.hearing .k { color: var(--celadon); }
  .case .node .where { color: var(--paper-dim); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case .node .rel { font-size: 13px; color: var(--mute); white-space: nowrap; }
  .case ul.todo { list-style: none; margin: 9px 0 0; padding: 9px 0 0; border-top: 1px dashed var(--rule); }
  .case ul.todo li { padding: 3px 0; font-size: 15px; }
  .case ul.todo .line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .case ul.todo .line .tt { flex: 1; min-width: 180px; }
  .case details { margin: 2px 0 2px 26px; font-size: 13px; color: var(--paper-dim); }
  .case details summary { cursor: pointer; color: var(--mute); list-style: none; display: inline-block; }
  .case details summary::before { content: "依据 ▸"; } .case details[open] summary::before { content: "依据 ▾"; }
  .case details div { white-space: pre-wrap; border-left: 2px solid var(--rule); padding-left: 10px; margin-top: 4px; word-break: break-all; }
  .case .matline { font-size: 13px; color: var(--mute); margin-top: 6px; }
  .case .matline a { color: var(--celadon); }
  .case .none { color: var(--mute); font-size: 14px; margin-top: 8px; }
  .case .cacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 11px; }
  .case .cacts .btn, .case .line .btn { padding: 1px 10px; font-size: 13px; }
  .case .btn.go { border-color: var(--gold); color: var(--gold); }
  .case.folded { padding: 9px 18px; }
  .case.folded .cbody { display: none; }
  .case.folded .chead h3 { font-size: 15.5px; font-weight: 500; }
  .case.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 34px color-mix(in srgb, var(--gold) 20%, transparent), var(--shadow); }
  .case.flash { animation: flash 1.5s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--gold), 0 0 46px color-mix(in srgb, var(--gold) 55%, transparent); } }
  #cases.first .case { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 70ms); }
  @media (min-width: 2300px) { #cases[data-view="card"] { display: block; columns: 2; column-gap: 14px; } #cases[data-view="card"] .case { break-inside: avoid; margin-bottom: 14px; } }

  /* 抽屉 */
  .drawer-mask { position: fixed; inset: 0; z-index: 34; background: color-mix(in srgb, #000 40%, transparent); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .drawer-mask.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 94vw); z-index: 35; transform: translateX(104%); transition: transform .35s cubic-bezier(.2,.8,.2,1); padding: 14px; display: flex; }
  .drawer.on { transform: none; }
  .drawer > section { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--night-2); }
  .drawer > section > .body { flex: 1; min-height: 0; overflow: auto; max-height: none; scrollbar-width: thin; }
  .drawer .rules { grid-template-columns: 1fr; }
  #rulesFail .dossier { margin-bottom: 12px; }

  /* 全页星空（动效"炫"且深色样式时） */
  #deep { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: none; }
  [data-fx="2"] #deep { display: block; }

  /* 动效档位：1 起有光标辉光、卡片浮起；2 另有流光边框、全页星空 */
  main section::before, .case::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .35s; z-index: 2;
    background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--gold) 11%, transparent), transparent 62%); }
  main section { position: relative; }
  html:not([data-fx="0"]) main section:hover::before, html:not([data-fx="0"]) .case:hover::before { opacity: 1; }
  html:not([data-fx="0"]) .case:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--gold) 45%, var(--rule)); }
  .case.hot { border-color: var(--seal); }
  [data-fx="2"] .case.hot { border-color: transparent; animation: spin 7s linear infinite;
    background: linear-gradient(var(--night-2), var(--night-2)) padding-box,
      conic-gradient(from var(--ang), var(--seal), transparent 22%, transparent 48%, var(--gold) 72%, var(--seal)) border-box; }
  [data-fx="2"] .case.hot.med { background: linear-gradient(var(--night-2), var(--night-2)) padding-box,
      conic-gradient(from var(--ang), var(--celadon), transparent 22%, transparent 48%, var(--gold) 72%, var(--celadon)) border-box; }
  [data-fx="2"] #cases.first .case.hot { animation: rise .7s cubic-bezier(.2,.8,.2,1) both, spin 7s linear infinite; animation-delay: calc(var(--i) * 70ms), 0s; }
  @keyframes spin { to { --ang: 360deg; } }
  [data-fx="2"] .hero .cd { text-shadow: 0 0 18px color-mix(in srgb, var(--gold) 45%, transparent); }
  [data-fx="0"] header::after, [data-fx="0"] #sky { display: none; }
  [data-fx="0"] * { animation: none !important; }
  html.boot .band, html.boot main section { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  html.boot .c1 section:nth-child(1) { animation-delay: .2s; } html.boot .c1 section:nth-child(2) { animation-delay: .32s; } html.boot .c1 section:nth-child(3) { animation-delay: .44s; }
  html.boot .c3 section:nth-child(1) { animation-delay: .3s; } html.boot .c3 section:nth-child(2) { animation-delay: .42s; } html.boot .c3 section:nth-child(3) { animation-delay: .54s; }

  /* 密度 */
  [data-density="compact"] body { font-size: 14px; line-height: 1.5; }
  [data-density="compact"] .case { padding: 9px 14px; } [data-density="compact"] #cases, [data-density="compact"] .col { gap: 10px; }
  [data-density="compact"] .case .chead h3 { font-size: 16px; } [data-density="compact"] section > h2 { padding: 10px 16px; }
  [data-density="compact"] .body { padding: 9px 14px 11px; } [data-density="compact"] .band .day { min-height: 74px; }
  [data-density="compact"] .hero { padding: 10px 14px; }

  /* 样式面板里的开关 */
  .themes { width: 440px; max-height: calc(100vh - 110px); overflow: auto; }
  .presets { grid-template-columns: repeat(3, 1fr); }
  .preset .pv { height: 46px; padding: 0 9px; } .preset .pv b { font-size: 16px; letter-spacing: .12em; }
  .preset .nt { font-size: 12px; padding: 4px 8px 5px; }
  .switches { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; align-items: center; font-size: 14px; color: var(--paper-dim); margin-bottom: 14px; }

  /* ---------- 新样式 ---------- */
  /* 极光：流动的极光，毛玻璃卡片 */
  [data-style="jiguang"] { --radius: 16px; --display: var(--sans); --dw: 600;
    --surface: color-mix(in srgb, var(--night-2) 55%, transparent);
    --rule: color-mix(in srgb, var(--paper) 13%, transparent); }
  [data-style="jiguang"] body::before { content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(70px); opacity: .55;
    background: radial-gradient(38% 30% at 22% 28%, var(--gold), transparent 70%), radial-gradient(34% 32% at 78% 18%, var(--celadon), transparent 70%),
      radial-gradient(40% 34% at 60% 82%, var(--seal), transparent 72%), radial-gradient(30% 30% at 10% 90%, #6C4BFF, transparent 70%);
    animation: aurora 26s ease-in-out infinite alternate; }
  @keyframes aurora { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 50% { transform: translate(4%, -3%) rotate(8deg) scale(1.1); } 100% { transform: translate(-4%, 4%) rotate(-6deg) scale(1.05); } }
  [data-style="jiguang"] main section, [data-style="jiguang"] .case, [data-style="jiguang"] .band { backdrop-filter: blur(22px) saturate(1.3); box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 14%, transparent), 0 18px 40px color-mix(in srgb, #000 35%, transparent); }
  [data-style="jiguang"] .brand h1 { background: linear-gradient(90deg, var(--gold), var(--celadon), var(--seal)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: .28em; }
  [data-style="jiguang"] .stamp .seal { border-radius: 50%; transform: none; border-width: 1px; box-shadow: 0 0 12px currentColor; }
  [data-style="jiguang"] .hero .cd, [data-style="jiguang"] .clock { background: linear-gradient(90deg, var(--gold), var(--celadon)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }

  /* 玄金：纯黑描金 */
  [data-style="xuanjin"] { --radius: 2px; --shadow: none; --surface: color-mix(in srgb, var(--night) 96%, var(--paper));
    --rule: color-mix(in srgb, var(--gold) 22%, var(--night));
    --field: radial-gradient(900px 500px at 50% -10%, color-mix(in srgb, var(--gold) 13%, transparent), transparent 70%),
      repeating-linear-gradient(135deg, transparent 0 46px, color-mix(in srgb, var(--gold) 3.5%, transparent) 46px 47px); }
  [data-style="xuanjin"] main section, [data-style="xuanjin"] .case:not(.hot), [data-style="xuanjin"] .band { border-color: transparent;
    background: linear-gradient(var(--surface), var(--surface)) padding-box,
      linear-gradient(135deg, var(--gold), transparent 22%, transparent 78%, color-mix(in srgb, var(--gold) 70%, transparent)) border-box; }
  [data-style="xuanjin"] section > h2, [data-style="xuanjin"] .colhead h2, [data-style="xuanjin"] .case .chead h3 { letter-spacing: .34em; font-weight: 500; }
  [data-style="xuanjin"] .case .chead h3 { letter-spacing: .08em; }
  [data-style="xuanjin"] .brand h1 { background: linear-gradient(100deg, #8a6a2c, var(--gold) 30%, #fff3cf 50%, var(--gold) 70%, #8a6a2c) 0 0 / 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 6s linear infinite; }
  @keyframes sheen { to { background-position: -220% 0; } }
  [data-style="xuanjin"] .case::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, transparent 40%, color-mix(in srgb, var(--gold) 14%, transparent) 50%, transparent 60%) 0 0 / 250% 100%; }
  [data-style="xuanjin"] .case:hover::after { opacity: 1; animation: sheen 1.4s ease-out; }
  [data-style="xuanjin"] .stamp .seal { border-radius: 0; transform: rotate(45deg) scale(.82); } [data-style="xuanjin"] .stamp .seal { font-size: 0; }
  [data-style="xuanjin"] .btn, [data-style="xuanjin"] .hbtn { border-radius: 0; }

  /* 墨韵：宣纸水墨，朱印 */
  [data-style="moyun"] { --display: var(--kai); --dw: 400; --radius: 3px; --shadow: none;
    --night-2: color-mix(in srgb, var(--night) 60%, #fff); --night-3: color-mix(in srgb, var(--night) 93%, var(--paper));
    --rule: color-mix(in srgb, var(--night) 78%, var(--paper));
    --field: radial-gradient(520px 300px at 88% 6%, color-mix(in srgb, var(--paper) 13%, transparent), transparent 70%),
      radial-gradient(700px 420px at 4% 96%, color-mix(in srgb, var(--paper) 10%, transparent), transparent 72%),
      radial-gradient(300px 200px at 70% 70%, color-mix(in srgb, var(--paper) 5%, transparent), transparent 70%); }
  [data-style="moyun"] section > h2, [data-style="moyun"] .colhead h2 { font-size: 21px; letter-spacing: .26em; }
  [data-style="moyun"] section > h2::before, [data-style="moyun"] .colhead h2::before { content: ""; width: 5px; height: 20px; background: var(--seal); border-radius: 1px; flex: none; }
  [data-style="moyun"] .case, [data-style="moyun"] main section, [data-style="moyun"] .band { border-color: color-mix(in srgb, var(--paper) 22%, transparent); border-bottom-width: 3px; border-bottom-color: color-mix(in srgb, var(--paper) 60%, transparent); }
  [data-style="moyun"] .case .chead h3 { font-size: 21px; } [data-style="moyun"] .brand h1 { font-size: 36px; }
  [data-style="moyun"] .stamp .seal { background: var(--seal); color: var(--night); border-color: var(--seal); border-radius: 3px; font-weight: 400; box-shadow: none; }
  [data-style="moyun"] .stamp.deadline .seal { background: none; color: var(--paper); border-color: var(--paper); }

  /* 赛博：网格、切角、扫描线 */
  [data-style="saibo"] { --display: var(--mono); --dw: 600; --radius: 0px; --shadow: none;
    --surface: color-mix(in srgb, var(--night-2) 82%, transparent); --rule: color-mix(in srgb, var(--celadon) 24%, var(--night));
    --field: linear-gradient(color-mix(in srgb, var(--celadon) 6%, transparent) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, color-mix(in srgb, var(--celadon) 6%, transparent) 1px, transparent 1px) 0 0 / 44px 44px,
      radial-gradient(1000px 520px at 80% -10%, color-mix(in srgb, var(--celadon) 13%, transparent), transparent 70%),
      radial-gradient(800px 500px at 0% 110%, color-mix(in srgb, var(--seal) 12%, transparent), transparent 65%); }
  [data-style="saibo"] body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .5;
    background: repeating-linear-gradient(0deg, transparent 0 2px, color-mix(in srgb, #000 16%, transparent) 2px 3px); }
  [data-style="saibo"] main section, [data-style="saibo"] .case, [data-style="saibo"] .band { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--celadon) 10%, transparent), inset 0 0 30px color-mix(in srgb, var(--celadon) 5%, transparent); }
  [data-style="saibo"] section > h2, [data-style="saibo"] .colhead h2 { letter-spacing: .18em; text-transform: uppercase; color: var(--celadon); text-shadow: 0 0 10px color-mix(in srgb, var(--celadon) 60%, transparent); }
  [data-style="saibo"] section > h2::before, [data-style="saibo"] .colhead h2::before { content: "//"; color: var(--seal); letter-spacing: 0; }
  [data-style="saibo"] .brand h1 { text-shadow: 2px 0 var(--seal), -2px 0 var(--celadon); letter-spacing: .3em; }
  [data-style="saibo"] .case .chead h3 { font-family: var(--sans); }
  [data-style="saibo"] .stamp .seal { border-radius: 0; transform: none; border-width: 1px; box-shadow: 0 0 8px currentColor; font-family: var(--sans); }
  [data-style="saibo"] .btn, [data-style="saibo"] .hbtn, [data-style="saibo"] .say, [data-style="saibo"] .seg, [data-style="saibo"] .chip, [data-style="saibo"] .say .go, [data-style="saibo"] .say .on { border-radius: 0; }
  [data-style="saibo"] .case.sel { box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 40px color-mix(in srgb, var(--gold) 14%, transparent); }
  [data-style="saibo"] .hero .cd { color: var(--celadon); text-shadow: 0 0 16px color-mix(in srgb, var(--celadon) 70%, transparent); }

  /* 青瓷：浅色温润 */
  [data-style="qingci"] { --display: var(--serif); --radius: 18px;
    --night-2: color-mix(in srgb, var(--night) 30%, #fff); --night-3: color-mix(in srgb, var(--night) 95%, var(--paper));
    --rule: color-mix(in srgb, var(--night) 86%, var(--paper));
    --shadow: 0 1px 2px color-mix(in srgb, var(--celadon) 14%, transparent), 0 14px 34px color-mix(in srgb, var(--celadon) 13%, transparent);
    --field: radial-gradient(900px 500px at 90% -10%, color-mix(in srgb, var(--celadon) 22%, transparent), transparent 70%),
      radial-gradient(700px 480px at -5% 105%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 65%); }
  [data-style="qingci"] section > h2::before, [data-style="qingci"] .colhead h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none; border: 2px solid var(--celadon); }
  [data-style="qingci"] .stamp .seal { border-radius: 50%; transform: none; border-width: 1.5px; box-shadow: none; }
  [data-style="qingci"] main section::before, [data-style="qingci"] .case::before { background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--celadon) 14%, transparent), transparent 62%); }

  /* 老样式补到案件卡上 */
  [data-style="hunyi"] .case, [data-style="hunyi"] .band { box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px color-mix(in srgb, var(--gold) 22%, transparent), var(--shadow); }
  [data-style="xingtu"] .case, [data-style="xingtu"] .band { border-color: color-mix(in srgb, var(--paper) 28%, transparent); }
  [data-style="xingtu"] .case .chead h3 { font-size: 21px; }
  [data-style="tianshu"] .colhead h2::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px 2px color-mix(in srgb, var(--gold) 45%, transparent); }

  /* 宽屏一屏装下，三栏各自滚动 */
  @media (min-width: 1500px) {
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .wrap { max-width: none; padding: 0 28px; }
    header .wrap { padding-top: 10px; padding-bottom: 9px; }
    body > .wrap { flex: none; width: 100%; }
    main.wrap { flex: 1; min-height: 0; width: 100%; padding-top: 14px; padding-bottom: 16px; grid-template-rows: minmax(0, 1fr); align-items: stretch;
      grid-template-columns: minmax(0, 3fr) minmax(0, 5fr) minmax(0, 3.3fr); }
    .col { min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; padding: 3px 5px 8px 3px; }
    .band .days { min-width: 0; grid-template-columns: repeat(14, minmax(0, 1fr)); }
  }
  @media (max-width: 1180px) { main.wrap { grid-template-columns: 1fr; } .say { order: 9; flex-basis: 100%; } }
  @media (min-width: 1180px) { .band .days { min-width: 0; grid-template-columns: repeat(14, minmax(0, 1fr)); } }
  /* 窄屏（笔记本 1366 至 1700）：按钮和栏目标题不折行，栏目说明小字让位 */
  .hbtn, .themebtn, .btn, .brand small, .seg button { white-space: nowrap; }
  .hbtn, .themebtn, section > h2 .count, .colhead h2 { flex: none; }
  section > h2 { white-space: nowrap; }
  section > h2 small.aside { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 1700px) {
    section > h2 { letter-spacing: .12em; padding-left: 16px; padding-right: 14px; gap: 7px; }
    section > h2 small.aside, .colhead small { display: none; }
    section > h2 .count { margin-right: auto; }
    .a-ask > h2 .count, .a-today > h2 .count { margin-right: 0; }
    .colhead h2 { margin-right: auto; }
    header .wrap { gap: 16px; } .brand h1 { font-size: 24px; letter-spacing: .2em; } .clock { font-size: 24px; padding-left: 16px; }
    .hero { grid-template-columns: 76px 1fr; gap: 12px; } .hero svg, .hero .ringbox { width: 76px; height: 76px; } .hero .cd { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { [data-style="jiguang"] body::before, .case.hot, [data-style="xuanjin"] .brand h1 { animation: none !important; } }
</style>

<body>
<header>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="wrap">

<div id="toast" role="status"></div>
<div id="busybar" aria-hidden="true"></div>

<script>
const TZ = 'Asia/Shanghai';
const WEEK = '日一二三四五六';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bj = (d = new Date()) => new Date(d.toLocaleString('en-US', {timeZone: TZ}));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const when = iso => iso ? new Date(iso).toLocaleString('zh-CN', {timeZone: TZ, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false}) : '';
let reportKind = 'morning';
// 本人称呼与本地经度由 /api/state 带来（config.json 的 本人、面板.经度）
let ME = '', LON = 120;

/* ===== 样式：每种样式 7 个基色，字体、底纹、标记形状由 CSS 按 data-style 切换 ===== */
const THEMES = {
  '天枢': {id: 'tianshu', note: '夜空星点，标记作星', c: {'--night': '#0C1428', '--paper': '#E8E5D8', '--paper-dim': '#A5AEC1', '--mute': '#75819B', '--seal': '#DB5A42', '--gold': '#EEC870', '--celadon': '#86C6BE'}},
  '浑仪': {id: 'hunyi', note: '青铜刻度，标记作印', c: {'--night': '#141A18', '--paper': '#E6DECB', '--paper-dim': '#B0AA98', '--mute': '#7F857B', '--seal': '#C95A3C', '--gold': '#C99A5B', '--celadon': '#72B0A0'}},
  '星图': {id: 'xingtu', note: '敦煌纸本，楷体浅色', c: {'--night': '#E7DDC7', '--paper': '#2A241D', '--paper-dim': '#574E42', '--mute': '#7A6F5C', '--seal': '#B3362A', '--gold': '#9C7120', '--celadon': '#3B7A63'}},
  '朗日': {id: 'langri', note: '白天用，简洁浅色', c: {'--night': '#F2F4F7', '--paper': '#18202E', '--paper-dim': '#485366', '--mute': '#6E7890', '--seal': '#C63E2E', '--gold': '#A87414', '--celadon': '#2B8670'}},
  '极光': {id: 'jiguang', note: '流动极光，毛玻璃', c: {'--night': '#070B1E', '--paper': '#EEF0FF', '--paper-dim': '#B3BAE0', '--mute': '#7A83B3', '--seal': '#FF5C8A', '--gold': '#7CF5D3', '--celadon': '#8AB4FF'}},
  '玄金': {id: 'xuanjin', note: '纯黑描金，流光', c: {'--night': '#0A0A0B', '--paper': '#EFE7D4', '--paper-dim': '#B5AB95', '--mute': '#7C7566', '--seal': '#D2553F', '--gold': '#D8B36A', '--celadon': '#8FB8A8'}},
  '赛博': {id: 'saibo', note: '网格切角，扫描线', c: {'--night': '#05080D', '--paper': '#D7F7F5', '--paper-dim': '#8FBCBF', '--mute': '#5A858A', '--seal': '#FF3D6E', '--gold': '#F5E663', '--celadon': '#2CF2E4'}},
  '墨韵': {id: 'moyun', note: '宣纸水墨，朱印', c: {'--night': '#F3EFE6', '--paper': '#1F1D1A', '--paper-dim': '#4D4841', '--mute': '#857D70', '--seal': '#B3261E', '--gold': '#8A6A2B', '--celadon': '#48705F'}},
  '青瓷': {id: 'qingci', note: '浅色温润，白天用', c: {'--night': '#EEF4F1', '--paper': '#1D2B2A', '--paper-dim': '#46605C', '--mute': '#6F8884', '--seal': '#C4543F', '--gold': '#9A7B2F', '--celadon': '#2F8F7C'}},
};
const KEY = 'tianshu-style';
function applyTheme(t) {
  if (!THEMES[t.preset]) t = {preset: '天枢'};
  const vars = {...THEMES[t.preset].c, ...(t.custom || {})};
  document.documentElement.dataset.style = THEMES[t.preset].id;
  Object.entries(vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  // 复选框、日期框等原生控件跟着深浅配色走：底色亮就用浅色控件
  const bg = (vars['--night'] || '#000').replace('#', ''), lum = parseInt(bg.slice(0, 2), 16) * .3 + parseInt(bg.slice(2, 4), 16) * .59 + parseInt(bg.slice(4, 6), 16) * .11;
  document.documentElement.style.colorScheme = lum > 140 ? 'light' : 'dark';
  document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', b.dataset.name === t.preset));
  document.querySelectorAll('.custom input').forEach(i => i.value = vars[i.dataset.var]);
  localStorage.setItem(KEY, JSON.stringify(t));
  try { Sky.refresh(); } catch {}  // 首次调用时星幕还没建好
}
const loadTheme = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {preset: '天枢'}; } catch { return {preset: '天枢'}; } };
document.getElementById('presets').innerHTML = Object.entries(THEMES).map(([n, {note, c}]) =>
  `<button class="preset" data-name="${n}"><span class="pv" style="--pv-bg:${c['--night']};--pv-ink:${c['--paper']}"><i style="background:${c['--gold']}"></i><i style="background:${c['--seal']}"></i><i style="background:${c['--celadon']}"></i><b>${n}</b></span><span class="nt">${note}</span></button>`).join('');
document.querySelectorAll('.preset').forEach(b => b.onclick = () => applyTheme({preset: b.dataset.name}));
document.querySelectorAll('.custom input').forEach(i => i.oninput = () => {
  const t = loadTheme(); t.custom = {...(t.custom || {}), [i.dataset.var]: i.value}; applyTheme(t);
});
document.getElementById('themeReset').onclick = () => applyTheme({preset: loadTheme().preset});
const panel = document.getElementById('themes'), tbtn = document.getElementById('themeBtn');
tbtn.onclick = e => { e.stopPropagation(); panel.classList.toggle('on'); tbtn.setAttribute('aria-expanded', panel.classList.contains('on')); };
document.addEventListener('click', e => { if (!panel.contains(e.target)) { panel.classList.remove('on'); tbtn.setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') panel.classList.remove('on'); });
applyTheme(location.hash ? {preset: decodeURIComponent(location.hash.slice(1))} : loadTheme());

/* ===== 时钟 ===== */
function tick() {
  const n = bj();
  document.getElementById('clock').firstChild.nodeValue = n.toTimeString().slice(0, 8);
  document.getElementById('date').textContent = `北京时间 ${n.getMonth() + 1}月${n.getDate()}日 周${WEEK[n.getDay()]}`;
}
setInterval(tick, 1000); tick();

/* ===== 操作 ===== */
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }
let BUSY = 0, LAST_POST = 0;
function busy(d) { BUSY += d; document.getElementById('busybar').classList.toggle('on', BUSY > 0); }
async function post(path, body) {
  // 点下去立刻有反应：被点的按钮转圈并锁住，顶部走进度条，办完才松开
  const btn = document.activeElement?.closest?.('button'), row = btn?.closest('li, .line');
  btn?.classList.add('busy'); row?.classList.add('doing'); busy(1);
  try {
    const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Panel': '1'}, body: JSON.stringify(body || {})});
    const text = await r.text(); let data = {}; try { data = JSON.parse(text); } catch {}
    LAST_POST = Date.now();
    if (!r.ok) { toast('没成功：' + (data.error || text || r.status)); return null; }
    return data;
  } catch (e) { toast('没成功：面板服务没响应'); return null; }
  finally { btn?.classList.remove('busy'); row?.classList.remove('doing'); busy(-1); }
}
// 刚写过东西的十五秒内，取数时等服务端重读完，免得看到旧数据
async function getLive(path) {
  const wait = Date.now() - LAST_POST < 15000;
  if (wait) busy(1);
  try { return await (await fetch(path + (wait ? '?wait=1' : ''))).json(); } finally { if (wait) busy(-1); }
}
async function answer(id, choice) { if (await post(`/api/cards/${id}/answer`, {choice})) { toast('已回答，接着办'); loadState(); } }
async function answerText(id) {
  const v = document.getElementById('txt' + id).value.trim();
  if (!v) return toast('先写回答');
  if (await post(`/api/cards/${id}/answer`, {text: v})) { toast('已提交'); loadState(); }
}
async function resolveCard(id) {
  const reason = prompt('不用决定了，写一句原因：');
  if (reason && await post(`/api/cards/${id}/resolve`, {reason})) { toast('已结案'); loadState(); }
}
async function ruleAct(name, act) {
  const body = {};
  if (act === 'pause') { const r = prompt(`暂停「${name}」，原因（可不填）：`); if (r === null) return; if (r) body.reason = r; }
  if (act === 'run') { if (!confirm(`现在运行一轮「${name}」？`)) return; body.reason = '面板手动运行'; }
  const res = await post(`/api/rules/${encodeURIComponent(name)}/${act}`, body);
  if (!res) return;
  toast(act === 'resume' && res.paused?.skipped?.count ? `已恢复，暂停期间跳过 ${res.paused.skipped.count} 条事件` : {run: '已排上', pause: '已暂停', resume: '已恢复'}[act]);
  loadState();
}
async function stopRun(id) { if (confirm(`停掉第 ${id} 轮？`) && await post(`/api/runs/${id}/cancel`)) { toast('已要求停止'); loadState(); } }


/* ===== 表单弹窗 ===== */
const DATA = {tasks: [], agenda: [], inbox: [], report: {}, marks: {}, names: {}};
const INFO = {};
function field(f) {
  const v = esc(f.value ?? '');
  if (f.type === 'html') return `<div id="f_${f.key}" class="fhtml">${f.html}</div>`;
  if (f.type === 'checks') return `<div id="f_${f.key}" class="checks">${f.options.length ? f.options.map(o =>
    `<label class="${o.disabled ? 'off' : ''}"><input type="checkbox" value="${esc(o.value)}" ${o.checked ? 'checked' : ''} ${o.disabled ? 'disabled' : ''}><span>${o.html}</span></label>`).join('') : `<div class="hint">${esc(f.empty || '没有')}</div>`}</div>`;
  if (f.list) return `<input id="f_${f.key}" list="l_${f.key}" value="${v}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}><datalist id="l_${f.key}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
  if (f.type === 'select') return `<select id="f_${f.key}">${f.options.map(o => `<option ${o === f.value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  if (f.type === 'textarea') return `<textarea id="f_${f.key}" rows="${f.rows || 3}">${v}</textarea>`;
  return `<input id="f_${f.key}" type="${f.type || 'text'}" value="${v}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>`;
}
function openForm(title, fields, onOk, okLabel = '保存', alt = null, wide = false) {
  document.getElementById('mTitle').textContent = title;
  document.querySelector('#mask .modal').classList.toggle('wide', wide);
  document.getElementById('mFields').innerHTML = fields.map(f => `<label for="f_${f.key}">${esc(f.label)}</label>${field(f)}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}`).join('');
  const read = () => Object.fromEntries(fields.filter(f => f.type !== 'html').map(f => [f.key, f.type === 'checks'
    ? [...document.querySelectorAll(`#f_${f.key} input:checked:not(:disabled)`)].map(c => c.value)
    : document.getElementById('f_' + f.key).value.trim()]));
  const ok = document.getElementById('mOk'), alb = document.getElementById('mAlt'); ok.textContent = okLabel;
  // 两个按钮互锁：取消这条还在写台账时点了保存，会把刚清掉的日期按表单旧值写回去
  const alts = alt ? [].concat(alt) : [];
  alb.parentElement.querySelectorAll('.alt-more').forEach(b => b.remove());
  const btns = alts.map((a, k) => { if (!k) return alb; const b = document.createElement('button'); b.className = 'btn alt-more'; alb.before(b); return b; });
  const lock = on => { ok.disabled = on; btns.forEach(b => b.disabled = on); };
  ok.onclick = async () => {
    lock(true); try { if (await onOk(read()) !== false) closeForm(); } finally { lock(false); }
  };
  alb.hidden = !alts.length;
  alts.forEach((a, k) => { btns[k].textContent = a.label; btns[k].onclick = async () => { lock(true); try { await a.fn(read()); } finally { lock(false); } }; });
  document.getElementById('mask').classList.add('on');
  setTimeout(() => document.querySelector('#mFields input, #mFields textarea, #mFields select')?.focus(), 30);
}
function closeForm() { document.getElementById('mask').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });
document.getElementById('mask').addEventListener('click', e => { if (e.target.id === 'mask') closeForm(); });

/* ===== 交给助理 ===== */
async function assist(text, msg = '已交给助理，结果会发到飞书') { if (await post('/api/assist', {text})) toast(msg); }
function askAssistant(prefill = '') {
  openForm('交给助理', [{key: 'text', label: '要办的事', type: 'textarea', rows: 5, value: prefill,
    hint: '和在飞书里发给「天枢中台」机器人一样，结果发到飞书'}], v => assist(v.text), '交给助理');
}
async function openPath(path) { if (path && await post('/api/open', {path})) toast('已打开'); }

/* ===== 待办 ===== */
const PRI = ['高', '中', '低'];
function newTask(caseName = '') {
  openForm('新建待办', [
    {key: 'title', label: '事项'}, {key: 'due_date', label: '截止日', type: 'date'},
    {key: 'assigned_to', label: '负责人', value: ME}, {key: 'priority', label: '优先级', type: 'select', options: PRI, value: '中'},
    {key: 'case_name', label: '关联案件', placeholder: '可不填', value: caseName}, {key: 'description', label: '说明', type: 'textarea'}],
    async v => { if (!v.title) { toast('先写事项'); return false; } if (await post('/api/tasks/add', v)) { toast('已新建'); loadTasks(); } });
}
function editTask(i) {
  const tk = DATA.tasks[i];
  openForm('编辑待办', [
    {key: 'title', label: '事项', value: tk.title}, {key: 'due_date', label: '截止日', type: 'date', value: tk.due_date},
    {key: 'assigned_to', label: '负责人', value: tk.assigned_to}, {key: 'priority', label: '优先级', type: 'select', options: PRI, value: tk.priority || '中'},
    {key: 'status', label: '状态', type: 'select', options: ['待处理', '进行中', '已完成', '已取消'], value: tk.status},
    {key: 'note', label: '补一句', placeholder: '可不填，记进任务说明'}],
    async v => { if (await post(`/api/tasks/${tk.id}/update`, v)) { toast('已保存'); loadTasks(); } });
}
async function setTask(i, status) {

const CUT_CAUSE = /(承揽|房屋|买卖|合同|纠纷|建设|工程|施工|租赁|借款|借贷|劳动|劳务|侵权|保险|物业|股权|服务|追偿|担保|保证|案件|一案|仲裁|一审|二审|再审|执行).*$/;

    if (cref && /\d{4}.*号/.test(cref.location || '')) c.no = cref.location;
    (it.refs || []).forEach(r => c.titles.add(stripMed(r.title)));
  });
  (DATA.tasks || []).forEach((t, i) => {
    const cn = t.case_name || '', ck = t.case_key || '', all = [...cases.values()];
    let c = cn && all.find(c => c.titles.has(cn));
    if (!c && ck) {
      const parts = ck.split(/诉|与|vs/i).map(s => s.trim()).filter(s => s.length >= 2);

    c.next = lefts.length ? Math.min(...lefts) : 99;

    // 只挂了待办的卡原先用待办里的案子简称（如「甲公司诉乙公司」）当标题；对上台账案件的，改用台账里的标准名称和案号
    if ((DATA.caseNos || []).length) {

    ${detail ? `<details><summary></summary><div>${esc(detail)}</div></details>` : ''}</li>`;

function caseCard(c, n) {

  const todos = c.tasks.flatMap(({t, i}) => (t.subtasks || []).length ? t.subtasks.filter(s => !s.done).map(s => todoRow(t, i, s)) : [todoRow(t, i, null)]).join('');

const INFERRED = /截止日[^。\n]{0,15}推定/;

/* 行政事务与非诉事务：按事情性质分，不看它是待办还是日程。

   说明里写了「类别：行政」或「类别：非诉」的以它为准（后写的覆盖先写的）；写了「活动：名称」的并成一组。 */
const ADMIN = /律协|专委会|委员|知产委|所务|管理层|办公会|讲座|授课|主讲|讲课|培训|论坛|沙龙|研讨|年会|大赛|展演|领队|参观|陪同|接待|专场|党支部|党建|工商联|政协|人大|协会|评优|报名|公众号|新闻稿|团建/;
const metaOf = (text, k) => { const m = [...(text || '').matchAll(new RegExp(k + '[：:]\\s*([^\\n。；;]+)', 'g'))]; return m.length ? m[m.length - 1][1].trim() : ''; };
function looseItems() {
  const out = [];
  (DATA.rest || []).forEach(({t, i}) => out.push({type: 'task', t, i, title: t.title, date: t.due_date || '', desc: t.description || ''}));
  DATA.agenda.forEach((it, i) => { if (kindOf(it.what) !== 'other' || it.left < 0) return;
    out.push({type: 'sched', it, i, title: it.name, date: it.date, time: timeOf(it), desc: (it.refs || []).map(r => r.desc || '').join('\n')}); });
  for (const x of out) {
    const c = metaOf(x.desc, '类别');
    x.cat = c.includes('行政') ? '行政' : c.includes('非诉') ? '非诉' : ADMIN.test(x.title) ? '行政' : '非诉';
    x.group = metaOf(x.desc, '活动'); if (x.group === '无') x.group = '';
    const left = x.type === 'task' ? dayLeft(x.date) : x.it.left;
    x.key = x.type === 'task' ? 'task:' + x.t.id : 'sched:' + ((x.it.refs || [])[0]?.id || x.title);
    x.auto = (x.type === 'task' && x.t.priority === '高') || (left !== null && left <= 1) ? '急' : left === null || left > 7 ? '缓' : '常';
    x.manual = !!DATA.marks[x.key]; x.level = DATA.marks[x.key] || x.auto;
  }
  // 待办标题里写了日期、当天正好有一场行政日程的，并到那场活动里
  for (const x of out) { if (x.type !== 'task' || x.group || x.cat !== '行政') continue;
    const m = x.title.match(/(\d{1,2})月(\d{1,2})日/); if (!m) continue;
    const s = out.find(y => y.type === 'sched' && y.cat === '行政' && +y.date.slice(5, 7) === +m[1] && +y.date.slice(8) === +m[2]);
    if (s) { s.group = s.group || s.title.replace(/（.*/, ''); x.group = s.group; } }
  return out;
}
/* 打开文件夹：已收微信材料的用绑定的卷宗，说明里写了「卷宗：」的用它，都没有就让服务端按客户、联系人、事项词找；
   找不准时列候选让本人选，选定后记进说明，下次直接打开 */
const descFolder = s => ((s || '').match(/(?:^|\]\s*)卷宗[：:]\s*(.+?)\s*$/m) || [])[1] || '';
async function openLoose(n) {
  const x = DATA.loose[n];
  const known = (x.type === 'task' && (DATA.mat || {})[x.t.id]?.folder) || descFolder(x.desc);
  if (known) return openPath(known);
  const r = await post('/api/folder', {title: x.title, desc: x.desc, client: x.type === 'task' ? x.t.client_name || '' : '', cat: x.cat});
  if (!r) return;
  if (r.folder) return openPath(r.folder);
  openForm('选文件夹：' + x.title.slice(0, 24), [
    {key: 'folder', label: '文件夹', value: r.candidates[0] || '', list: r.candidates, placeholder: '粘贴文件夹路径，或从下拉里选',
      hint: '打开后记进这条事务，下次直接打开' + (r.fallback ? '。留空则打开上级目录：' + r.fallback : '')}],
    async v => {
      if (!v.folder) { if (r.fallback) openPath(r.fallback); else { toast('先填文件夹'); return false; } return; }
      if (!await post('/api/open', {path: v.folder})) return false;
      const line = '卷宗：' + v.folder;
      if (x.type === 'task') await post(`/api/tasks/${x.t.id}/update`, {note: line});
      else for (const ref of (x.it.refs || []).filter(f => f.kind === 'schedule'))
        await post(`/api/schedules/${ref.id}/update`, {description: (ref.desc ? ref.desc + '\n' : '') + line});
      toast('已打开，并记进这条事务'); loadSlow();
    }, '打开并记住');
}

const MORE_BTN = `<button class="btn ghost" onclick="event.stopPropagation();const s=this.parentElement;s.classList.toggle('more-on');this.textContent=s.classList.contains('more-on')?'收起':'更多'">更多</button>`;
function renderLoose(cat, id, empty) {
  const items = DATA.loose.map((x, n) => ({x, n})).filter(o => o.x.cat === cat);
  const blocks = [], groups = {};
  for (const o of items) {
    if (!o.x.group) { blocks.push({date: o.x.date || '9999', rows: [o]}); continue; }
    if (!groups[o.x.group]) blocks.push(groups[o.x.group] = {name: o.x.group, date: '9999', rows: []});
    groups[o.x.group].rows.push(o);
  }
  for (const b of blocks) { b.rows.sort((a, c) => (a.x.date || '9999').localeCompare(c.x.date || '9999')); b.date = b.rows[0].x.date || '9999'; b.rank = Math.min(...b.rows.map(o => RANK[o.x.level])); }
  blocks.sort((a, b) => a.rank - b.rank || a.date.localeCompare(b.date));
  document.getElementById(id).innerHTML = blocks.length ? blocks.map(b => {
    const rows = b.rows.map(o => looseRow(o.x, o.n)).join('');
    if (!b.name) return rows;
    const ds = b.rows.map(o => o.x.date).filter(Boolean), span = ds.length ? (ds[0] === ds[ds.length - 1] ? ds[0].slice(5) : `${ds[0].slice(5)} 至 ${ds[ds.length - 1].slice(5)}`) : '';
    return `<li class="grp"><div class="gh">${esc(b.name)}<small>${b.rows.length} 项${span ? ' · ' + span : ''}</small></div><ul class="intake">${rows}</ul></li>`;
  }).join('') : `<li class="empty">${empty}</li>`;
  return items.length;
}

function humanCron(s) {
  let m = s.match(/^\*\/(\d+) (\d+)-(\d+) \* \* \*$/);
  if (m) return `${m[2]} 至 ${m[3]} 点每 ${m[1]} 分钟`;
  m = s.match(/^(\d+) ([\d,]+) \* \* \*$/);
  if (m) return '每天 ' + m[2].split(',').map(h => `${h.padStart(2, '0')}:${m[1].padStart(2, '0')}`).join('、');
  return s;
}
function renderState(s) {

  renderAsks(s.cards || []);

  document.getElementById('rulesDot').hidden = !bad.length;

  const active = (s.runs || []).filter(r => ['queued', 'claimed', 'unknown'].includes(r.state));
  const ids = new Set(active.map(r => r.id));
  if (renderState.prev) [...renderState.prev].filter(id => !ids.has(id)).forEach((_, k) => setTimeout(() => { Sky.shower(); Deep.shower(); }, k * 1600));
  renderState.prev = ids;
  document.getElementById('running').className = active.length ? 'on' : '';

    `<i></i>${esc(r.rule)}${r.state === 'queued' ? ' 排队中' : ' 正在办'}，第 ${r.id} 轮 <button class="btn sm ghost" style="margin-left:8px" onclick="stopRun(${r.id})">停止</button>`).join('　');

  }).join('');
  const who = [...(s.agents || []).filter(a => !/codex/i.test(a.id)).map(a => [a.name, a.online]), ...(s.channels || []).map(c => [c.name, c.online])];
  document.getElementById('who').innerHTML = who.map(([n, on]) => `<span><i class="dot ${on ? '' : 'off'}"></i>${esc(n)}</span>`).join('');
}

function md(text) {
  // 只认汇报里用得到的几种：## 小标题、- 列表（可缩进一层）、1. 编号、**加粗**、`代码`
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/~~(.+?)~~/g, '<s>$1</s>');
  return text.split('\n').filter(l => !l.startsWith('# ')).map(l => {
    if (l.startsWith('## ')) return `<h3>${inline(l.slice(3))}</h3>`;
    let m = l.match(/^(\s*)[-*] (.*)$/);
    if (m) return `<li${m[1].length >= 2 ? ' class="sub"' : ''}>${inline(m[2])}</li>`;
    m = l.match(/^(\s*)(\d+)\. (.*)$/);
    if (m) return `<li class="num${m[1].length >= 2 ? ' sub' : ''}"><b>${m[2]}.</b> ${inline(m[3])}</li>`;
    return l.trim() ? `<p>${inline(l.trim())}</p>` : '';
  }).join('').replace(/(<li[^>]*>.*?<\/li>)+/g, m => `<ul>${m}</ul>`);
}

  }
  const n = s => work.filter(w => (LOG_STATE[w.state] || LOG_STATE.failed)[0] === s).length;

  const d = new Date(LOG_DAY + 'T00:00:00');

    <p class="logsum">办成 <b>${n('办成')}</b> 件 · 失败 <b class="${n('失败') ? 'bad' : ''}">${n('失败')}</b> 件 · 被停止 ${n('被停止')} 件${n('正在办') + n('排队中') ? ` · 进行中 ${n('正在办') + n('排队中')} 件` : ''} · 巡查无事 ${idleN} 轮</p>
    ${work.length ? `<ul class="log">${work.slice().reverse().map(w => { const [lab, cls] = LOG_STATE[w.state] || ['失败', 'bad'];

/* ===== 星幕与星钟 =====

  const cv = document.getElementById('sky'), g = cv.getContext('2d'), host = cv.parentElement;
